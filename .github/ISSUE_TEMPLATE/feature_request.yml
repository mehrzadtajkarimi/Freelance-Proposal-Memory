name: Feature request
description: Suggest an improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Please describe the general need. Do not include real client briefs or private proposal data."
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain who needs this and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
